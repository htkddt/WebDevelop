name: Reusable - AI Service

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ai-test:
    name: ai-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai_service
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/ai_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI service tests
        run: pytest
