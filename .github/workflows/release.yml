name: Release

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest

    # 🔥 Chỉ chạy khi push tag (git push origin <tag_name>)
    # if: github.ref_type == 'tag'

    # 🔥 Chạy khi:
    # git push origin <tag_name>
    # auto-tag done
    if: startsWith(github.ref, 'refs/tags/v') || needs.auto-tag.outputs.created == 'true'

    # Không cần set default và không cần kèm cd frontend command vì release work trên artifact được tạo ra từ job build
    # defaults:
    #   run:
    #     working-directory: frontend

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: frontend-build-${{ github.run_id }}
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ needs.auto-tag.outputs.tag }}"
          fi

          VER="${TAG#v}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/**

          # 🔥 Beta nếu có dấu "-"
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}