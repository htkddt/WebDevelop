name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/reusable-frontend.yml

  nestjs-api:
    uses: ./.github/workflows/reusable-nest.yml

  ai-service:
    uses: ./.github/workflows/reusable-ai.yml
