name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      # CI builds against the frontend's local API contract; it never deploys this artifact.
      api_base_url: http://localhost:5000/api

  nestjs-api:
    uses: ./.github/workflows/reusable-nest.yml

  ai-service:
    uses: ./.github/workflows/reusable-ai.yml
