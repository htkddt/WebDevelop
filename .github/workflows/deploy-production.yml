name: Production deployment

on:
  # Keep production deployment opt-in until a public environment is configured.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-production-config:
    name: check-production-config
    runs-on: ubuntu-latest
    outputs:
      api_configured: ${{ steps.api-url.outputs.configured }}
    steps:
      - name: Check public NestJS API URL
        id: api-url
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [[ "$VITE_API_BASE_URL" =~ ^https://.+/api$ ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Frontend deployment skipped::Set VITE_API_BASE_URL to the public HTTPS NestJS URL ending in /api to deploy the frontend."

  frontend:
    needs: validate-production-config
    if: ${{ needs.validate-production-config.outputs.api_configured == 'true' }}
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      api_base_url: ${{ vars.VITE_API_BASE_URL }}

  nestjs-api:
    uses: ./.github/workflows/reusable-nest.yml

  ai-service:
    uses: ./.github/workflows/reusable-ai.yml

  deploy-frontend:
    name: deploy-frontend
    needs: [frontend, nestjs-api, ai-service]
    if: ${{ always() && needs.frontend.result == 'success' && needs.nestjs-api.result == 'success' && needs.ai-service.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trigger-backend-deployment:
    name: trigger-backend-deployment
    needs: [nestjs-api, ai-service]
    runs-on: ubuntu-latest
    env:
      BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
    steps:
      - name: Trigger configured backend deploy hook
        if: ${{ env.BACKEND_DEPLOY_HOOK != '' }}
        run: curl --fail --retry 3 --request POST "$BACKEND_DEPLOY_HOOK"

      - name: Explain backend deploy hook fallback
        if: ${{ env.BACKEND_DEPLOY_HOOK == '' }}
        run: echo "Configure BACKEND_DEPLOY_HOOK or use your host's Git integration for NestJS and AI service deployments."
