name: Preview deployment

on:
  push:
    branches-ignore: [main, master]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/reusable-frontend.yml

  deploy-preview:
    name: deploy-preview
    needs: frontend
    runs-on: ubuntu-latest
    environment: preview
    env:
      PREVIEW_DEPLOY_HOOK: ${{ secrets.PREVIEW_DEPLOY_HOOK }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Trigger configured preview host
        if: ${{ env.PREVIEW_DEPLOY_HOOK != '' }}
        run: curl --fail --retry 3 --request POST "$PREVIEW_DEPLOY_HOOK"

      - name: Explain preview artifact fallback
        if: ${{ env.PREVIEW_DEPLOY_HOOK == '' }}
        run: echo "Preview build is available as the frontend-dist artifact. Configure PREVIEW_DEPLOY_HOOK for a hosted preview."
